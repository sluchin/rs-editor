name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # 手動実行. タグを打たずにビルドし, 成果物を Actions の Artifacts からダウンロードできる.
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write # GitHub Releases への書き込み権限に必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin は Rust のターゲットではないため, macOS は 2 つのアーキテクチャを個別に入れる.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # Tauri アプリのビルド (deb / rpm / AppImage / msi / nsis / dmg).
      # タグ実行時は GitHub Releases のドラフトへアップロードする. 手動実行時はアップロードしない.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "rseditor ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Windows: インストーラとは別に, exe 単体のポータブル版 zip を作る
      - name: Create Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = "rseditor_${{ github.ref_name }}_windows_x64_portable.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/rseditor.exe" -DestinationPath $zip
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable zip to release
        if: matrix.os == 'windows-latest' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" $env:PORTABLE_ZIP --clobber

      # 成果物を Artifacts にも保存する (手動実行時はここからダウンロードする)
      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rseditor-${{ matrix.os }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ env.PORTABLE_ZIP }}
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri/WebKitGTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libncurses-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Check formatting (Prettier + cargo fmt)
        run: npm run format:check

      - name: Lint (ESLint + clippy)
        run: npm run lint:all

      - name: Test (Vitest + cargo test)
        run: npm run test:all

      - name: Build frontend
        run: npm run build

  # カバレッジ. フロントエンド (vitest) もバックエンド (cargo tarpaulin) も, 100% を下回ったら失敗する.
  # check と並べて実行する.
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # tarpaulin の計測用のビルドは, check のビルドと別にキャッシュする.
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: "v2-rust-coverage"

      # ビルド済みの cargo-tarpaulin を入れる (ソースからのビルドは時間がかかるため).
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libncurses-dev

      - name: Install frontend dependencies
        run: npm ci

      # cargo のビルドは tauri.conf.json の frontendDist (dist) を参照するため, 先にビルドする.
      - name: Build frontend
        run: npm run build

      # vitest --coverage (thresholds 100%) と cargo tarpaulin --fail-under 100
      - name: Coverage
        run: npm run coverage

      # 失敗したときに, どこが通っていないかを見られるように, 報告を残す.
      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            tarpaulin-report.html
          if-no-files-found: warn
          retention-days: 7

  # API ドキュメント (フロントエンドは TypeDoc, バックエンドは cargo doc) を GitHub Pages に出す.
  # main への push のときだけ (pull request では出さない).
  deploy-docs:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri/WebKitGTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libncurses-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # cargo doc は tauri.conf.json の frontendDist (dist) を参照するため, 先にビルドする.
      - name: Build frontend
        run: npm run build

      # docs/html/fe (TypeDoc) と docs/html/be (cargo doc) を作る. トップページは docs/html/index.html.
      - name: Build documentation
        run: npm run doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: docs/html/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
